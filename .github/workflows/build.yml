name: build-electron-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Garde-fou : on refait tourner tests + type-check avant de consommer
      # un build electron-builder, qui est la partie coûteuse.
      - name: Unit tests
        run: npm test

      # database.json fait ~16 Mo et est importé avec resolveJsonModule :
      # tsc doit en construire le type littéral complet, d'où le heap élargi.
      - name: Build Vite app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Build Electron TS
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:electron

      - name: Build Electron installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win portable nsis --publish never

      # Les noms de fichiers incluent la version (voir electron-builder.json) :
      # MIL-Browser-Portable-<version>.exe et MIL-Browser-Setup-<version>.exe.
      - name: Upload artifacts (portable)
        uses: actions/upload-artifact@v4
        with:
          name: mil-browser-portable
          path: release/*Portable*.exe
          if-no-files-found: error

      - name: Upload artifacts (installer)
        uses: actions/upload-artifact@v4
        with:
          name: mil-browser-installer
          path: release/*Setup*.exe
          if-no-files-found: error
