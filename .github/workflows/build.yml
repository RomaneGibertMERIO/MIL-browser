name: build-electron-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Build Electron TS
        run: npm run build:electron

      - name: Build Electron installer
        run: npx electron-builder --win portable nsis

      - name: Upload artifacts (portable)
        uses: actions/upload-artifact@v4
        with:
          name: mil-browser-portable
          path: release/*portable*.exe

      - name: Upload artifacts (installer)
        uses: actions/upload-artifact@v4
        with:
          name: mil-browser-installer
          path: release/*Setup*.exe
